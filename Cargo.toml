# Profiles and lints follow programming-model.md, section 10.

[workspace]
resolver = "3"
members = ["crates/*", "tests/tools", "tests/session", "tests/run", "tests/agent", "tests/protocol-llm", "tests/host", "tests/local", "tests/codecs", "tests/machine", "tests/channel", "tests/agent-process", "tests/hosts", "tests/local-process"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
skein-lib = { git = "https://git.ekanayaka.io/ai/skein.git" }
skein-codec = { git = "https://git.ekanayaka.io/ai/skein.git" }
skein-codegen = { git = "https://git.ekanayaka.io/ai/skein.git" }
skein-channel = { git = "https://git.ekanayaka.io/ai/skein.git" }
skein-heap = { git = "https://git.ekanayaka.io/ai/skein.git" }
skein-world = { git = "https://git.ekanayaka.io/ai/skein.git" }
skein-io = { git = "https://git.ekanayaka.io/ai/skein.git" }
skein-shell = { git = "https://git.ekanayaka.io/ai/skein.git" }
skein-sim = { git = "https://git.ekanayaka.io/ai/skein.git" }
skein-fake-machine = { git = "https://git.ekanayaka.io/ai/skein.git" }
skein-http = { git = "https://git.ekanayaka.io/ai/skein.git" }
skein-json = { git = "https://git.ekanayaka.io/ai/skein.git" }
skein-fake-checkout = { git = "https://git.ekanayaka.io/ai/skein.git" }
skein-fake-channel = { git = "https://git.ekanayaka.io/ai/skein.git" }
skein-llm = { git = "https://git.ekanayaka.io/ai/skein.git" }
skein-llm-connection = { git = "https://git.ekanayaka.io/ai/skein.git" }
skein-tls = { git = "https://git.ekanayaka.io/ai/skein.git" }
skein-tls-world = { git = "https://git.ekanayaka.io/ai/skein.git" }
skein-fake-llm-domain = { git = "https://git.ekanayaka.io/ai/skein.git" }
skein-fake-llm-protocol = { git = "https://git.ekanayaka.io/ai/skein.git" }
skein-llm-world = { git = "https://git.ekanayaka.io/ai/skein.git" }
skein-oauth = { git = "https://git.ekanayaka.io/ai/skein.git" }
skein-fake-oauth = { git = "https://git.ekanayaka.io/ai/skein.git" }
smith-host-domain = { path = "crates/smith-host-domain" }
smith-local-domain = { path = "crates/smith-local-domain" }
smith-host-world = { path = "tests/host" }
smith-local-world = { path = "tests/local" }
smith-agent-world = { path = "tests/agent" }
smith-domain = { path = "crates/smith-domain" }
smith-domain-run = { path = "crates/smith-domain-run" }
smith-domain-session = { path = "crates/smith-domain-session" }
smith-domain-tools = { path = "crates/smith-domain-tools" }
smith-protocol-llm = { path = "crates/smith-protocol-llm" }
smith-protocol-machine = { path = "crates/smith-protocol-machine" }
smith-charter = { path = "crates/smith-charter" }
smith-transcript = { path = "crates/smith-transcript" }
smith-channel = { path = "crates/smith-channel" }
smith-protocol-channel = { path = "crates/smith-protocol-channel" }
smith-host-protocol = { path = "crates/smith-host-protocol" }
smith-agent-service = { path = "crates/smith-agent-service" }
smith-local-protocol = { path = "crates/smith-local-protocol" }
smith-local-service = { path = "crates/smith-local-service" }
smith-agent-process-world = { path = "tests/agent-process" }
smith-local-process-world = { path = "tests/local-process" }
smith = { path = "crates/smith" }
smith-run-world = { path = "tests/run" }
smith-session-world = { path = "tests/session" }
smith-tools-world = { path = "tests/tools" }

# Panics are fail-stop and overflow traps, in every profile. (The test harness
# needs unwinding, so cargo ignores `panic` for test targets.)
[profile.dev]
panic = "abort"
overflow-checks = true

[profile.release]
panic = "abort"
overflow-checks = true

# The lints for the step crates (every domain, protocol and io layer: lib is skein's).
# Disallowed types, macros and methods are listed in clippy.toml. Ordinary Rust
# (simulators, test harnesses) declares its own [lints] table.
[workspace.lints.rust]
unsafe_code = "deny"                  # and forbid at every step crate's root
elided_lifetimes_in_paths = "deny"    # a type that borrows says so: Reader<'_>
unused_must_use = "deny"
non_ascii_idents = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unit_bindings = "deny"
let_underscore_drop = "deny"          # drop explicitly, or bind a name
missing_debug_implementations = "deny" # state is inspectable in tests and traces
unused_lifetimes = "deny"
redundant_lifetimes = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight the domain.
module_name_repetitions = "allow"     # llm::LlmX reads fine next to agent::X
missing_errors_doc = "allow"          # errors are enum values, documented on the enum
missing_panics_doc = "allow"          # panics are assertions, named by expect("...")
needless_pass_by_value = "allow"      # cell handlers take the source state by value
single_match_else = "allow"           # a two-armed match on Option is as clear as if let

# What is out of step code (programming-model.md, section 10.3).
wildcard_enum_match_arm = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
float_arithmetic = "deny"
unwrap_used = "deny"
let_underscore_must_use = "deny"
mem_forget = "deny"
todo = "deny"
unimplemented = "deny"
impl_trait_in_params = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"

# Beyond the table of 10.3: the rest of what the subset leaves out.
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
disallowed_methods = "deny"           # closure-taking combinators, panicking slice ops, ...
allow_attributes = "deny"             # #[expect(.., reason = "..")], which fails once it is stale
match_wildcard_for_single_variants = "deny"
enum_glob_use = "deny"                # a variant is named with its enum
wildcard_imports = "deny"
panic = "deny"                        # assert!, unreachable!("why") or expect("invariant")
missing_assert_message = "deny"       # an assertion names what it relies on
assertions_on_result_states = "deny"
unused_result_ok = "deny"
let_underscore_untyped = "deny"
mixed_read_write_in_expression = "deny"  # one side effect per statement
infinite_loop = "deny"
empty_drop = "deny"
exit = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
use_debug = "deny"
host_endian_bytes = "deny"            # byte order is chosen, not inherited from the host
fn_to_numeric_cast_any = "deny"
default_numeric_fallback = "deny"     # every integer has a stated width
std_instead_of_core = "deny"
std_instead_of_alloc = "deny"
alloc_instead_of_core = "deny"
partial_pub_fields = "deny"           # a struct is plain data or opaque, not both
mod_module_files = "deny"
tests_outside_test_module = "deny"
iter_over_hash_type = "deny"
