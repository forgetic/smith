# The two test suites (docs/development/workflow.md): the focused one, every
# test but the fuzzy ones, within 15 seconds; and the fuzzy one, the test
# binaries named fuzzy_* beside each world's focused tests, within a minute. A
# suite past its budget fails, naming the tests it stopped; a test past its
# slow period is flagged SLOW as it runs.

[profile.default]
default-filter = "not binary(/^fuzzy_/) and not binary(=live)"
global-timeout = "15s"
slow-timeout = { period = "3s" }

# The worlds' tests first, the longest, then the many short unit tests behind
# them, so that the run ends close to its total over the threads.
[[profile.default.overrides]]
filter = "kind(test)"
priority = 10

[profile.fuzzy]
default-filter = "binary(/^fuzzy_/) and not binary(=live)"
global-timeout = "60s"
slow-timeout = { period = "20s" }

# Measuring, not gating: no budget. With -j 1, each test's own time:
#   cargo nextest run --workspace --profile measure -j 1
#   cargo nextest run --workspace --profile measure -j 1 --ignore-default-filter -E 'binary(/^fuzzy_/)'
[profile.measure]
global-timeout = "1h"
slow-timeout = { period = "60s" }

# TLS fixtures share the same loopback addresses across real stories.
[test-groups.real-local]
max-threads = 1

[[profile.default.overrides]]
filter = "package(smith-real-world) or binary(end_to_end)"
test-group = "real-local"

# Real backends are opt-in and never part of the merge gate.
[profile.live]
default-filter = "binary(=live)"
global-timeout = "10m"
slow-timeout = { period = "60s" }
test-threads = 1
retries = 0
fail-fast = false
