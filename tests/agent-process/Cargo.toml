[package]
name = "smith-agent-process-world"
description = "The Smith agent process over a scripted host and simulated kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
skein-fake-llm-domain.workspace = true
skein-fake-llm-protocol.workspace = true
skein-fake-peers.workspace = true
skein-channel.workspace = true
skein-fake-channel.workspace = true
skein-fake-machine.workspace = true
skein-io.workspace = true
skein-json.workspace = true
skein-lib.workspace = true
skein-llm-connection.workspace = true
skein-llm.workspace = true
skein-llm-world.workspace = true
skein-sim.workspace = true
skein-tls.workspace = true
skein-tls-world.workspace = true
skein-world.workspace = true
smith-agent-service.workspace = true
smith-agent-shell.workspace = true
smith-agent-world.workspace = true
