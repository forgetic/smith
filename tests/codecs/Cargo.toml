[package]
name = "smith-codecs-world"
description = "Step tests of smith's generated protocol codecs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dev-dependencies]
skein-codegen.workspace = true
skein-lib.workspace = true
skein-codec.workspace = true
smith-charter.workspace = true
smith-transcript.workspace = true

[lints.rust]
unsafe_code = "deny"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
