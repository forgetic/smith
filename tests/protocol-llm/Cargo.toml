[package]
name = "smith-protocol-llm-world"
description = "The protocol LLM adapter with a composed agent fixture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
skein-lib.workspace = true
skein-json.workspace = true
smith-domain.workspace = true
smith-protocol-llm.workspace = true
smith-host-domain.workspace = true
smith-host-world.workspace = true
smith-session-world.workspace = true
smith-domain-tools.workspace = true
smith-tools-world.workspace = true
skein-fake-checkout.workspace = true
skein-fake-llm-domain.workspace = true
skein-llm.workspace = true
skein-llm-connection.workspace = true
skein-tls.workspace = true
skein-llm-world.workspace = true
skein-world.workspace = true

# Ordinary Rust (programming-model.md, section 10.2), so not the step crates' lints.
# tests/clippy.toml bans what would make a run unrepeatable.
[lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"          # the world asserts its invariants by panicking
wildcard_enum_match_arm = "deny"      # a new variant must break the translation
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
