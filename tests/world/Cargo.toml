[package]
name = "smith-world-tests"
description = "Consumer checks for skein's shared domain-world harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dev-dependencies]
skein-lib.workspace = true
skein-world.workspace = true

# Tests are ordinary Rust (programming-model.md, section 10.2).
# tests/clippy.toml preserves deterministic clocks and ordered observations.
[lints.rust]
unsafe_code = "deny"                  # the shared allocator stays in skein
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"          # the harness asserts the contracts it keeps by panicking
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
