[package]
name = "smith"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
skein-world.workspace = true
skein-lib.workspace = true
skein-oauth.workspace = true
libc = "0.2"
skein-io.workspace = true
skein-shell.workspace = true
skein-channel.workspace = true
skein-http.workspace = true
skein-llm.workspace = true
skein-llm-connection.workspace = true
skein-tls.workspace = true
smith-domain.workspace = true
smith-agent-service.workspace = true
smith-local-domain.workspace = true
smith-local-protocol.workspace = true
smith-local-service.workspace = true
smith-host-domain.workspace = true
smith-host-protocol.workspace = true
smith-protocol-channel.workspace = true
smith-protocol-llm.workspace = true
smith-protocol-machine.workspace = true
smith-channel.workspace = true
smith-charter.workspace = true
smith-transcript.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustls-native-certs = "0.8"

[dev-dependencies]
skein-sim.workspace = true
skein-fake-machine.workspace = true
skein-tls-world.workspace = true
smith-agent-process-world.workspace = true
smith-host-world.workspace = true

[lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
# The shell parses operator configuration and reports startup errors in
# ordinary Rust (programming-model.md, section 10.2).
disallowed_types = "allow"
disallowed_methods = "allow"
disallowed_macros = "allow"
